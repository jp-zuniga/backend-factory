preview = true

[lint]
  extend-safe-fixes = ["TC"]
  select            = ["ALL"]

  ignore = [
    "blank-line-after-function",
    "f-string-in-exception",
    "incorrect-blank-line-before-class",
    "missing-copyright-notice",
    "missing-trailing-comma",
    "multi-line-summary-first-line",
    "raise-vanilla-args",
    "raw-string-in-exception",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "undocumented-public-module",
    "undocumented-public-nested-class",
    "undocumented-public-package",
    "unnecessary-multiline-docstring",
  ]

  [lint.isort]
    case-sensitive         = true
    combine-as-imports     = true
    force-wrap-aliases     = true
    forced-separate        = ["typing_extensions", "ty_extensions"]
    lines-between-types    = 1
    order-by-type          = true
    relative-imports-order = "closest-to-furthest"

  [lint.per-file-ignores]
    "**/api_core/**" = ["private-member-access"]

    "**/api_tests/**" = [
      "assert",
      "hardcoded-password-func-arg",
      "hardcoded-password-string",
      "magic-value-comparison",
      "pytest-fixture-autouse",
      "typing-only-first-party-import",
      "typing-only-standard-library-import",
      "typing-only-third-party-import",
      "unused-function-argument",
    ]

    "**/config.py" = [
      "typing-only-first-party-import",
      "typing-only-standard-library-import",
      "typing-only-third-party-import",
    ]

    # packages + single-file modules
    "**/controllers**" = [
      "typing-only-first-party-import",
      "typing-only-standard-library-import",
      "typing-only-third-party-import",
    ]

    "**/manage.py"     = ["import-outside-top-level"]
    "**/migrations/**" = ["line-too-long", "mutable-class-default"]

    # packages + single-file modules
    "**/schemas**" = [
      "typing-only-first-party-import",
      "typing-only-standard-library-import",
      "typing-only-third-party-import",
    ]

    "**/settings.py" = ["line-too-long"]
