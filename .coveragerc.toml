[report]
  exclude_also = [
    "def __str__",
  ]

  fail_under = 90

  omit = [
    "*/__init__.py",
    "*/apps.py",
    "*/management/*",
    "*/migrations/*",
    "*/*_tests/*",
  ]

  show_missing = true
  skip_covered = true

[run]
  branch = true

  omit = [
    "*/__init__.py",
    "*/apps.py",
    "*/asgi.py",
    "*/config.py",
    "*/manage.py",
    "*/types.py",
    "*/wsgi.py",
    "*/management/*",
    "*/migrations/*",
    "*/*_tests/*",
  ]

  source = ["src"]
