[project]
  copyright = "&copy 2026, Joaquín Zúñiga"

  edit_uri  = "edit/main/docs/"
  repo_name = "jp-zuniga/backend-factory"
  repo_url  = "https://github.com/jp-zuniga/backend-factory"

  site_author      = "Joaquín Zúñiga"
  site_description = "backend factory!"
  site_name        = "backend-factory"

  nav = [
    { "Home" = "index.md" },
    {
      "Getting started" = [
        "getting-started/index.md",
        "getting-started/requirements.md",
        "getting-started/installation.md",
        "getting-started/layout.md",
        "getting-started/commands.md",
      ],
    },
    {
      "Concepts" = [
        "concepts/index.md",
        "concepts/request-lifecycle.md",
        "concepts/controllers.md",
        "concepts/schemas.md",
        "concepts/operations.md",
        "concepts/models.md",
        "concepts/database.md",
        "concepts/routing.md",
        "concepts/errors.md",
        "concepts/openapi.md",
        "concepts/decisions.md",
      ],
    },
    {
      "API" = [
        "api/index.md",
        "api/conventions.md",
        "api/authentication.md",
        "api/sessions.md",
        "api/email-confirmation.md",
        "api/two-factor.md",
        "api/users.md",
        "api/errors.md",
      ],
    },
    {
      "Guides" = [
        "guides/index.md",
        "guides/new-resource.md",
        "guides/sub-resources.md",
        "guides/base-models.md",
        "guides/permissions.md",
        "guides/seeding.md",
        "guides/email.md",
        "guides/testing.md",
        "guides/deployment.md",
      ],
    },
    {
      "Reference" = [
        "reference/index.md",
        "reference/configuration.md",
        "reference/catalog.md",
      ],
    },
  ]

  [project.markdown_extensions]
    abbr       = {}
    admonition = {}
    attr_list  = {}
    def_list   = {}
    md_in_html = {}
    tables     = {}

    toc = {
      permalink = true,
      toc_depth = 3,
    }

    [project.markdown_extensions.pymdownx]
      caret     = {}
      details   = {}
      emoji     = {}
      highlight = {}
      keys      = {}
      mark      = {}
      tilde     = {}

      blocks.caption = {}

      tasklist.custom_checkbox = true

      snippets.auto_append = [
        "docs/snippets/abbrs.md",
        "docs/snippets/links.md",
      ]

      superfences.custom_fences = [
        {
          name   = "mermaid",
          class  = "mermaid",
          format = "pymdownx.superfences.fence_code_format",
        },
      ]

      [project.markdown_extensions.pymdownx.tabbed]
        alternate_style = true

        slugify = {
          kwds.case = "lower",
          object    = "pymdownx.slugs.slugify",
        }

    [project.markdown_extensions.zensical.extensions]
      preview.configurations.targets.include = ["**/*.md"]

  [project.theme]
    features = [
      "content.code.copy",
      "content.tooltips",
      "navigation.footer",
      "navigation.indexes",
      "navigation.instant",
      "navigation.instant.prefetch",
      "navigation.instant.progress",
      "navigation.path",
    ]

    favicon = "logo.svg"
    logo    = "logo.svg"
    variant = "modern"

    [[project.theme.palette]]
      media       = "(prefers-color-scheme: light)"
      scheme      = "default"
      toggle.icon = "lucide/sun"
      toggle.name = "Go to dark mode"

    [[project.theme.palette]]
      media       = "(prefers-color-scheme: dark)"
      scheme      = "slate"
      toggle.icon = "lucide/moon"
      toggle.name = "Go to light mode"

  [project.validation]
    invalid_link_anchors  = true
    invalid_links         = true
    shadowed_definitions  = true
    shadowed_footnotes    = true
    unresolved_footnotes  = true
    unresolved_references = false
    unused_definitions    = false
    unused_footnotes      = true
